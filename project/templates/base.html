{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}AnimeFlix{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
/* =========================================
   1. VARIABLES & RESET
   ========================================= */
:root {
  --neon-purple: #bc13fe;
  --neon-cyan: #00f0ff;
  --neon-pink: #ff0055;
  --neon-yellow: #fcee0a;
  --bg-dark: #050505;
  --glass: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text-main: #ffffff;
  --easing: cubic-bezier(0.19, 1, 0.22, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

body { 
    width: 100%; min-height: 100vh; 
    background-color: var(--bg-dark); 
    color: var(--text-main); 
    font-family: 'Outfit', sans-serif;
    overflow-x: hidden; 
}

/* Scrollbar */
body::-webkit-scrollbar { width: 6px; }
body::-webkit-scrollbar-track { background: var(--bg-dark); }
body::-webkit-scrollbar-thumb { 
    background: linear-gradient(var(--neon-purple), var(--neon-cyan)); 
    border-radius: 10px; 
}

/* =========================================
   2. "LIVING" BACKGROUND SYSTEM
   ========================================= */
.bg-wrapper {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    z-index: -1; overflow: hidden; pointer-events: none;
    background: radial-gradient(circle at center, #0a0a12 0%, #000 100%);
}

/* Layer 1: Moving Auroras */
.aurora {
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: 
        radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.15), transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.15), transparent 50%);
    animation: rotateAurora 20s linear infinite;
    filter: blur(60px);
}
@keyframes rotateAurora { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Layer 2: 3D Cyber Grid */
.cyber-grid {
  position: absolute; width: 300%; height: 300%; bottom: -100%; left: -100%;
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px), 
    linear-gradient(90deg, rgba(188, 19, 254, 0.1) 1px, transparent 1px);
  background-size: 100px 100px; 
  transform: perspective(500px) rotateX(60deg);
  animation: gridMove 6s linear infinite; 
  mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
}
@keyframes gridMove { 
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 
    100% { transform: perspective(500px) rotateX(60deg) translateY(100px); } 
}

/* Layer 3: CRT Scanlines (Texture) */
.scanlines {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
    );
    pointer-events: none; z-index: 999;
}

/* Layer 4: Vignette */
.vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 60%, black 100%);
    z-index: 998; pointer-events: none;
}

/* =========================================
   3. GLITCH TEXT EFFECT (RGB Split)
   ========================================= */
.glitch {
    position: relative;
    color: white;
}
.glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-dark); 
}
.glitch::before {
    left: 2px; text-shadow: -2px 0 var(--neon-pink);
    clip-path: inset(44% 0 61% 0);
    animation: glitch-anim 2s infinite linear alternate-reverse;
}
.glitch::after {
    left: -2px; text-shadow: -2px 0 var(--neon-cyan);
    clip-path: inset(50% 0 30% 0);
    animation: glitch-anim 2.5s infinite linear alternate-reverse;
}
@keyframes glitch-anim {
    0% { clip-path: inset(20% 0 80% 0); }
    20% { clip-path: inset(60% 0 10% 0); }
    40% { clip-path: inset(40% 0 50% 0); }
    60% { clip-path: inset(80% 0 5% 0); }
    80% { clip-path: inset(10% 0 70% 0); }
    100% { clip-path: inset(30% 0 20% 0); }
}

/* =========================================
   4. LOADING SCREEN (Animated)
   ========================================= */
.loader-wrapper { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: #000; z-index: 10000; 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1);
}
.loader-wrapper.loaded { transform: translateY(-100%); pointer-events: none; }

.bunny-box { 
    width: 140px; height: 140px; margin-bottom: 30px; 
    filter: drop-shadow(0 0 15px var(--neon-cyan));
    animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.bunny-path {
    fill: none; stroke: var(--neon-cyan); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 600; stroke-dashoffset: 600;
    animation: drawBunny 3s ease-in-out forwards;
}
.bunny-face { stroke: var(--neon-pink); stroke-width: 3; opacity: 0; animation: fadeIn 0.5s 2.2s forwards; }

@keyframes drawBunny { to { stroke-dashoffset: 0; } }
@keyframes fadeIn { to { opacity: 1; } }

.loader-text {
    font-family: 'Orbitron', sans-serif; font-size: 3rem; font-weight: 900; 
    letter-spacing: 5px; color: white;
}

/* =========================================
   5. HEADER & GLASSMORPHISM
   ========================================= */
.main-header { 
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 1200px; z-index: 1000; 
    padding: 15px 30px; border-radius: 16px;
    
    /* GLASS EFFECT */
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    
    display: flex; justify-content: space-between; align-items: center; 
    transition: 0.4s;
}

.brand-name { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 800; color: white; letter-spacing: 2px; }
.brand-highlight { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-link { 
    text-decoration: none; color: rgba(255,255,255,0.7); 
    font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;
    transition: 0.3s; position: relative;
}
.nav-link:hover { color: white; text-shadow: 0 0 10px var(--neon-purple); }
.nav-link::before {
    content:''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    width: 0%; height: 2px; background: var(--neon-cyan); transition: 0.3s; box-shadow: 0 0 5px var(--neon-cyan);
}
.nav-link:hover::before { width: 100%; }

/* Cyber Button */
.btn-cyber {
    padding: 10px 25px; 
    background: rgba(255, 0, 85, 0.1);
    border: 1px solid var(--neon-pink); 
    color: var(--neon-pink);
    font-family: 'Orbitron'; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;
    text-transform: uppercase; text-decoration: none; 
    clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
    transition: 0.3s;
    position: relative; overflow: hidden;
}
.btn-cyber:hover {
    background: var(--neon-pink); color: white; box-shadow: 0 0 20px var(--neon-pink);
}

/* =========================================
   6. MAGNETIC CURSOR
   ========================================= */
.cursor-dot { 
    position: fixed; width: 8px; height: 8px; background: var(--neon-cyan); 
    border-radius: 50%; pointer-events: none; z-index: 10001; 
    box-shadow: 0 0 10px var(--neon-cyan);
    transition: transform 0.1s;
}
.cursor-outline { 
    position: fixed; width: 40px; height: 40px; 
    border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; 
    pointer-events: none; z-index: 10001; 
    transition: transform 0.15s, width 0.2s, height 0.2s, background 0.2s;
}

/* =========================================
   7. PAGE CONTENT
   ========================================= */
.page-content { padding-top: 140px; opacity: 0; animation: fadeUp 1s forwards 3s; position: relative; z-index: 1; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* Particle Utility */
.particle { position: absolute; background: white; border-radius: 50%; pointer-events: none; }

</style>
</head>

<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="loader-wrapper" id="loader">
    <div class="bunny-box">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path class="bunny-path" d="M 70 110 Q 50 150 100 150 Q 150 150 130 110 Q 160 30 140 10 Q 115 50 100 80 Q 85 50 60 10 Q 40 30 70 110" />
            <g class="bunny-face">
                <circle cx="80" cy="115" r="2" fill="white" />
                <circle cx="120" cy="115" r="2" fill="white" />
                <path d="M 95 130 Q 100 135 105 130" fill="none" />
            </g>
        </svg>
    </div>
    <div class="loader-text glitch" id="loaderText" data-text="ANIMEFLIX" data-value="ANIMEFLIX">ANIMEFLIX</div>
</div>

<div class="bg-wrapper">
    <div class="aurora"></div>
    <div class="cyber-grid"></div>
    <div id="particle-container"></div>
</div>

<div class="cursor-dot" data-cursor-dot></div>
<div class="cursor-outline" data-cursor-outline></div>

<header class="main-header">
    <a href="/" class="logo-container" style="text-decoration:none;" data-hover>
        <span class="brand-name">
            <span id="brandText" data-value="ANIME">ANIME</span><span class="brand-highlight">FLIX</span>
        </span>
    </a>

    <nav class="nav-links">
        <a href="/" class="nav-link" data-hover>Home</a>
        <a href="#" class="nav-link" data-hover>Simulcast</a>
        <a href="#" class="nav-link" data-hover>Manga</a>
        <a href="#" class="btn-cyber" data-hover>Premium</a>
    </nav>
</header>

<main class="page-content">
    {% block content %}
    <div style="text-align: center; margin-top: 50px;">
        <h1 class="glitch" data-text="NEXT GEN" style="font-family: 'Orbitron'; font-size: 4rem; margin-bottom: 20px;">
            NEXT GEN
        </h1>
        <p style="color: rgba(255,255,255,0.7); max-width: 600px; margin: 0 auto; font-size: 1.2rem;">
            Experience the ultimate transparency.
        </p>
    </div>
    {% endblock %}
</main>

<script>
// --- CONFIG: HACKER TEXT ---
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";

const runHackEffect = (element) => {
    let iteration = 0;
    const originalText = element.dataset.value; 
    clearInterval(element.interval);
    
    element.interval = setInterval(() => {
        element.innerText = originalText
        .split("")
        .map((letter, index) => {
            if(index < iteration) return originalText[index];
            return letters[Math.floor(Math.random() * letters.length)];
        })
        .join("");
        
        if(iteration >= originalText.length) clearInterval(element.interval);
        iteration += 1 / 3;
    }, 30);
}

document.addEventListener("DOMContentLoaded", () => {
    
    // 1. Loader Hack
    runHackEffect(document.getElementById('loaderText'));
    
    // 2. Remove Loader
    setTimeout(() => { document.getElementById('loader').classList.add('loaded'); }, 3000);

    // 3. Particles (Starfield)
    const particleContainer = document.getElementById('particle-container');
    for(let i=0; i<50; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.width = Math.random() * 3 + 'px';
        p.style.height = p.style.width;
        // Randomly assign Cyan or Purple or White
        const rand = Math.random();
        p.style.background = rand > 0.6 ? 'var(--neon-cyan)' : (rand > 0.3 ? 'var(--neon-purple)' : 'white');
        
        p.style.opacity = Math.random() * 0.8;
        p.style.animation = `floatUp ${Math.random() * 20 + 10}s linear infinite`;
        particleContainer.appendChild(p);
    }
    
    // Dynamic Keyframes for particles
    const styleSheet = document.createElement("style");
    styleSheet.innerText = `
        @keyframes floatUp { 
            from { transform: translateY(0); } 
            to { transform: translateY(-100vh); } 
        }
    `;
    document.head.appendChild(styleSheet);

    // 4. Advanced Magnetic Cursor
    const dot = document.querySelector("[data-cursor-dot]");
    const outline = document.querySelector("[data-cursor-outline]");
    const hoverTargets = document.querySelectorAll("[data-hover]");

    if (window.matchMedia("(pointer: fine)").matches) {
        window.addEventListener("mousemove", (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            // Dot follows exactly
            dot.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
            
            // Outline follows with lag
            outline.animate({
                left: `${x}px`, top: `${y}px`, transform: `translate(-50%, -50%)`
            }, { duration: 500, fill: "forwards" });
        });

        // Magnetic Snap Effect
        hoverTargets.forEach(el => {
            el.addEventListener("mouseenter", () => {
                outline.style.width = "60px";
                outline.style.height = "60px";
                outline.style.background = "rgba(0, 240, 255, 0.15)";
                outline.style.borderColor = "transparent";
                dot.style.background = "white"; 
                // Trigger Hacker Text on Logo hover
                if(el.classList.contains('logo-container')) {
                    runHackEffect(document.getElementById('brandText'));
                }
            });
            el.addEventListener("mouseleave", () => {
                outline.style.width = "40px";
                outline.style.height = "40px";
                outline.style.background = "transparent";
                outline.style.borderColor = "rgba(255,255,255,0.4)";
                dot.style.background = "var(--neon-cyan)";
            });
        });
    }
});
</script>

</body>
</html>
